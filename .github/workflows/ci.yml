# Checks every push to main and every pull request, and once a week runs the
# example apps against the latest framework releases too.
#
# Actions are pinned by commit SHA (the comment names the release the SHA was
# taken from, checked on 2026-10-31); Dependabot keeps them current.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      # Before any build, on purpose: the tests read src/, never dist/, as on a fresh clone.
      - run: npm test
      # Builds, then checks the declarations, publint and are-the-types-wrong.
      - run: npm run lint:package
      - name: Pack
        run: |
          npm pack
          npm run pack:check
      - run: npm run test:smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: submitator-badges-*.tgz
          if-no-files-found: error

  runtimes:
    name: Runtime ${{ matrix.name }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: node 20, runtime: node, node: 20 }
          - { name: node 22, runtime: node, node: 22 }
          - { name: node 24, runtime: node, node: 24 }
          - { name: bun, runtime: bun, node: 24 }
          - { name: deno, runtime: deno, node: 24 }
          - { name: workerd, runtime: workerd, node: 24 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node.js runs the mock wall server in every job (and Miniflare for workerd).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - if: matrix.runtime == 'workerd'
        run: npm install --no-package-lock --no-audit --no-fund --prefix test/smoke/workerd
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      # The checks run against the packed tarball, exactly what npm would ship.
      - name: Unpack
        run: |
          mkdir unpacked
          tar -xzf submitator-badges-*.tgz -C unpacked
      - run: node test/smoke/run.mjs --runtime ${{ matrix.runtime }} --package unpacked/package

  examples:
    name: Example ${{ matrix.app }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app:
          - next-app
          - next-cache-components
          - next-pages
          - nuxt
          - sveltekit
          - astro-ssr
          - astro-static
          - astro4-floor
          - astro5-floor
          - node-http
          - next-client-only
          - nuxt-client-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # parse5 for check-html.mjs comes from the repo's dev dependencies.
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - run: node examples/run-example.mjs ${{ matrix.app }} --tarball "$(ls submitator-badges-*.tgz)" --save-page
      # The served homepage, for the backend's checks (test/fixtures/badge_wall_v1/pages there).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: page-${{ matrix.app }}
          path: |
            test/fixtures/contract-v1/pages/${{ matrix.app }}.html
            test/fixtures/contract-v1/pages/manifest.json
          if-no-files-found: error

  pages:
    name: Example pages, one artifact
    needs: examples
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: page-*
          merge-multiple: true
          path: pages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-v1-pages
          path: pages/
          if-no-files-found: error

  latest:
    name: Latest ${{ matrix.app }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app:
          - next-app
          - next-cache-components
          - next-pages
          - nuxt
          - sveltekit
          - astro-ssr
          - astro-static
          - next-client-only
          - nuxt-client-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - run: node examples/run-example.mjs ${{ matrix.app }} --tarball "$(ls submitator-badges-*.tgz)" --latest
